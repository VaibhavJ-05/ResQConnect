server:
  port: 8081

spring:
  application:
    name: identity-camp-service
  jackson:
    time-zone: Asia/Kolkata
  datasource:
    url: jdbc:mysql://localhost:3306/resqconnect_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: jdbc
    password: jdbc
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: SuperSecretKeyForResQConnectDevDeployment2026
  issuer: ResQConnect.API
  audience: ResQConnect.Client
  expiry-days: 7

management:
  endpoints:
    web:
      exposure:
        include: info, health
